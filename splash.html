<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pratinjau Splash Screen</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="splash.css">
  <script src="splash.js" defer></script>
</head>
<body class="splash-active">
  <div id="splash" role="status" aria-label="Memuat halaman Bakery Area">

      <span class="letter">B</span><span class="letter">a</span><span class="letter">k</span><span class="letter">e</span><span class="letter">r</span><span class="letter">y</span><span class="letter space"></span><span class="letter">A</span><span class="letter">r</span><span class="letter">e</span><span class="letter">a</span><span class="letter">!</span><span class="letter"></span><span class="letter"></span>
    </span>
    <img class="logo" src="assets/logo1.png" alt="Logo Bakery Area">
  </div>
</body>
</html>
